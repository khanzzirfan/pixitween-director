<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 750" width="1280" height="750" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7d7790"/>
    </marker>
    <style>
      .h { font-size: 17px; font-weight: 700; fill: #1d1b22; }
      .s { font-size: 12px; fill: #6b6676; }
      .t { font-size: 14px; font-weight: 700; fill: #1d1b22; }
      .l { font-size: 12px; fill: #3d3946; }
      .n { font-size: 11px; fill: #5a5566; }
      .k { font-size: 11px; font-weight: 700; fill: #6b6676; letter-spacing: 0.08em; }
      .ar { stroke: #7d7790; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1279" height="749" rx="18" fill="#fcfbf8" stroke="#e7e3da"/>
  <text x="40" y="50" style="font-size:22px;font-weight:700;fill:#1d1b22">MuseReels · architecture</text>
  <text x="40" y="74" class="s">One photo and one sentence in, a committed 3D film out. Every sheet and every frame is drawn by our own engine, not by an image model.</text>

  <!-- Browser -->
  <rect x="30" y="100" width="260" height="560" rx="14" fill="#ffffff" stroke="#cfe6e1" stroke-width="1.5"/>
  <text x="50" y="130" class="h">Browser</text>
  <text x="50" y="148" class="s">React studio</text>

  <rect x="48" y="166" width="224" height="92" rx="10" fill="#f8f7f4" stroke="#e4e0d8"/>
  <text x="64" y="194" class="t">Brief</text>
  <text x="64" y="216" class="l">photo, voice or text</text>
  <text x="64" y="234" class="l">or a product CSV</text>

  <rect x="48" y="272" width="224" height="92" rx="10" fill="#f8f7f4" stroke="#e4e0d8"/>
  <text x="64" y="300" class="t">Plan</text>
  <text x="64" y="322" class="l">live step clock</text>
  <text x="64" y="340" class="l">sheets and storyboard</text>

  <rect x="48" y="378" width="224" height="92" rx="10" fill="#eef8f6" stroke="#a9d8cf"/>
  <text x="64" y="406" class="t">Player · Motion engine</text>
  <text x="64" y="428" class="l">our own GSAP + Three.js player</text>
  <text x="64" y="446" class="l">plays the film's JSON</text>

  <rect x="48" y="484" width="224" height="92" rx="10" fill="#f8f7f4" stroke="#e4e0d8"/>
  <text x="64" y="512" class="t">Export</text>
  <text x="64" y="534" class="l">MP4, encoded in the page</text>
  <text x="64" y="552" class="l">or a final AI movie</text>

  <text x="50" y="612" class="n">The film is data, not a video:</text>
  <text x="50" y="630" class="n">undo, check and re-export any time.</text>

  <!-- Browser <-> Server -->
  <line x1="292" y1="250" x2="357" y2="250" class="ar" marker-end="url(#a)"/>
  <text x="324" y="241" class="n" text-anchor="middle">REST</text>
  <line x1="357" y1="292" x2="292" y2="292" class="ar" marker-end="url(#a)"/>
  <text x="324" y="310" class="n" text-anchor="middle">live SSE</text>

  <!-- Server -->
  <rect x="360" y="100" width="580" height="560" rx="14" fill="#ffffff" stroke="#cfe6e1" stroke-width="1.5"/>
  <text x="382" y="130" class="h">Server</text>
  <text x="382" y="148" class="s">Node · Hono</text>
  <text x="382" y="180" class="k">SHEET FILM · FIVE STEPS, ONE AFTER THE OTHER</text>

  <g>
    <rect x="382" y="192" width="98" height="84" rx="10" fill="#f6f3ff" stroke="#c9bbf5"/>
    <text x="431" y="218" class="t" text-anchor="middle">1 Parts</text>
    <text x="431" y="240" class="n" text-anchor="middle">SAM 3.1</text>
    <text x="431" y="256" class="n" text-anchor="middle">Spark · Image</text>

    <rect x="491.5" y="192" width="98" height="84" rx="10" fill="#eef8f6" stroke="#a9d8cf"/>
    <text x="540.5" y="218" class="t" text-anchor="middle">2 Sheets</text>
    <text x="540.5" y="240" class="n" text-anchor="middle">drawn by</text>
    <text x="540.5" y="256" class="n" text-anchor="middle">our engine</text>

    <rect x="601" y="192" width="98" height="84" rx="10" fill="#f6f3ff" stroke="#c9bbf5"/>
    <text x="650" y="218" class="t" text-anchor="middle">3 Check</text>
    <text x="650" y="240" class="n" text-anchor="middle">Muse Spark</text>
    <text x="650" y="256" class="n" text-anchor="middle">vs the photo</text>

    <rect x="710.5" y="192" width="98" height="84" rx="10" fill="#f6f3ff" stroke="#c9bbf5"/>
    <text x="759.5" y="218" class="t" text-anchor="middle">4 Film sheet</text>
    <text x="759.5" y="240" class="n" text-anchor="middle">code rules,</text>
    <text x="759.5" y="256" class="n" text-anchor="middle">engine, Spark</text>

    <rect x="820" y="192" width="98" height="84" rx="10" fill="#eef8f6" stroke="#a9d8cf"/>
    <text x="869" y="218" class="t" text-anchor="middle">5 Commit</text>
    <text x="869" y="240" class="n" text-anchor="middle">3D film +</text>
    <text x="869" y="256" class="n" text-anchor="middle">storyboard</text>

    <line x1="481" y1="234" x2="490" y2="234" class="ar" marker-end="url(#a)"/>
    <line x1="590.5" y1="234" x2="600" y2="234" class="ar" marker-end="url(#a)"/>
    <line x1="700" y1="234" x2="709.5" y2="234" class="ar" marker-end="url(#a)"/>
    <line x1="809.5" y1="234" x2="819" y2="234" class="ar" marker-end="url(#a)"/>
  </g>
  <text x="382" y="300" class="n" font-style="italic">At most one board revision, which mends what the sheets and the film sheet showed.</text>

  <rect x="382" y="320" width="260" height="150" rx="10" fill="#eef8f6" stroke="#a9d8cf"/>
  <text x="398" y="348" class="t">Code rules</text>
  <text x="398" y="372" class="l">Muse's board → film JSON</text>
  <text x="398" y="392" class="l">3D world · product from the cut-out</text>
  <text x="398" y="412" class="l">title and price as real 3D text</text>
  <text x="398" y="432" class="l">length, layout and title checks</text>

  <rect x="658" y="320" width="260" height="150" rx="10" fill="#eef8f6" stroke="#a9d8cf"/>
  <text x="674" y="348" class="t">Headless Chromium</text>
  <text x="674" y="372" class="l">the same Motion engine as the player</text>
  <text x="674" y="392" class="l">draws the sheets and film sheet</text>
  <text x="674" y="412" class="l">renders frames for the AI movie</text>
  <text x="674" y="432" class="l">and server-side MP4</text>

  <rect x="382" y="486" width="260" height="150" rx="10" fill="#f8f7f4" stroke="#e4e0d8"/>
  <text x="398" y="514" class="t">Catalog line-up</text>
  <text x="398" y="538" class="l">one 3D film per CSV row</text>
  <text x="398" y="558" class="l">1 to 4 films at a time</text>
  <text x="398" y="578" class="l">a failure never stops the rest</text>
  <text x="398" y="598" class="l">resumes after a restart</text>

  <rect x="658" y="486" width="260" height="150" rx="10" fill="#f8f7f4" stroke="#e4e0d8"/>
  <text x="674" y="514" class="t">Event log</text>
  <text x="674" y="538" class="l">every step and every Meta call</text>
  <text x="674" y="558" class="l">cost per film, to the cent</text>
  <text x="674" y="578" class="l">streamed live to the studio</text>

  <!-- Server -> right column -->
  <line x1="942" y1="250" x2="987" y2="250" class="ar" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="942" y1="480" x2="987" y2="480" class="ar" marker-end="url(#a)"/>
  <line x1="942" y1="604" x2="987" y2="604" class="ar" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Meta -->
  <rect x="990" y="100" width="260" height="312" rx="14" fill="#f6f3ff" stroke="#c9bbf5" stroke-width="1.5"/>
  <text x="1010" y="130" class="h">Meta Model API</text>
  <text x="1010" y="148" class="s">the only key you need</text>
  <rect x="1008" y="166" width="224" height="52" rx="9" fill="#ffffff" stroke="#ddd3fa"/>
  <text x="1022" y="188" class="t">Muse Spark 1.3</text>
  <text x="1022" y="206" class="n">board, form, checks, revision</text>
  <rect x="1008" y="226" width="224" height="52" rx="9" fill="#ffffff" stroke="#ddd3fa"/>
  <text x="1022" y="248" class="t">SAM 3.1</text>
  <text x="1022" y="266" class="n">product cut-out and outline</text>
  <rect x="1008" y="286" width="224" height="52" rx="9" fill="#ffffff" stroke="#ddd3fa"/>
  <text x="1022" y="308" class="t">Muse Image</text>
  <text x="1022" y="326" class="n">element pictures</text>
  <rect x="1008" y="346" width="224" height="52" rx="9" fill="#ffffff" stroke="#ddd3fa"/>
  <text x="1022" y="368" class="t">Muse Voice Transcribe</text>
  <text x="1022" y="386" class="n">the spoken brief</text>

  <!-- Fal -->
  <rect x="990" y="430" width="260" height="100" rx="14" fill="#fff5ec" stroke="#f2c9a0" stroke-width="1.5"/>
  <text x="1010" y="460" class="h">Fal · MiniMax H3</text>
  <text x="1010" y="482" class="l">optional final cut from 3D frames</text>
  <text x="1010" y="502" class="n">visitor's own key · $0.05 to $0.08 per s</text>

  <!-- Store -->
  <rect x="990" y="548" width="260" height="112" rx="14" fill="#f3f3f1" stroke="#d6d4cf" stroke-width="1.5"/>
  <text x="1010" y="578" class="h">SQLite + asset files</text>
  <text x="1010" y="602" class="l">films, versions, event logs</text>
  <text x="1010" y="622" class="l">photos, cut-outs, sheets</text>

  <!-- Legend -->
  <g transform="translate(40,694)">
    <rect width="14" height="14" rx="3" fill="#eef8f6" stroke="#a9d8cf"/>
    <text x="22" y="12" class="n">our code and engine</text>
    <rect x="170" width="14" height="14" rx="3" fill="#f6f3ff" stroke="#c9bbf5"/>
    <text x="192" y="12" class="n">uses a Meta model</text>
    <rect x="330" width="14" height="14" rx="3" fill="#fff5ec" stroke="#f2c9a0"/>
    <text x="352" y="12" class="n">optional, billed by Fal</text>
    <rect x="500" width="14" height="14" rx="3" fill="#f3f3f1" stroke="#d6d4cf"/>
    <text x="522" y="12" class="n">storage</text>
  </g>
</svg>
