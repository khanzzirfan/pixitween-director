# The app is MuseReels. If Fly says the name is taken, rename it here and change PUBLIC_BASE_URL to match.
app = "musereels"
primary_region = "iad"

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  # The Fly volume is mounted at /data and the stores write there, so films survive a restart.
  DATA_DIR = "/data"
  # Fly sits directly in front of the server, so its client-address header can be trusted for rate limits.
  TRUST_FLY_CLIENT_IP = "true"
  # Change with the app name.
  PUBLIC_BASE_URL = "https://musereels.fly.dev"
  # The Muse crew: Wonder leads parallel Spark builders. Set CREW_ENABLED = "false" to fall back to the single director.
  CREW_ENABLED = "true"
  # The cinematic cut is checked by a headless-Chromium frame review, and this image has no Chromium: keep the flat finish here.
  CINEMATIC_CUT = "0"
  SHOWRUNNER_MODEL = "muse-wonder-1.0"
  # The full Muse Spark 1.3, not the contributor tier: storyboard, builders, frame review and chat edits.
  META_SPARK_MODEL = "muse-spark-1.3"
  CREW_FILM_BUDGET_USD = "1.5"
  FILMS_STARTS_PER_WINDOW = "2"
  # Optional crew tuning (see deploy/README.md): FILMS_IN_FLIGHT_MAX = "2", FILMS_QUEUE_MAX = "4",
  # FILMS_WINDOW_SEC = "300".

# Secrets are set with `fly secrets set` and are never listed in this file.
[http_service]
  internal_port = 8080
  force_https = true
  # Machines stay on during judging (5 to 16 Nov 2026), so nobody waits for a cold start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"

[mounts]
  source = "director_data"
  destination = "/data"
  initial_size = "1gb"
