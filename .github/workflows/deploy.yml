# Deploys MuseReels to Fly.io when run by hand. Needs one repository secret: FLY_API_TOKEN (a deploy token for the musereels app).
# Runtime secrets (META_API_KEY, DIRECTOR_PASSCODE, ...) live on Fly via `fly secrets set`, never in GitHub or this file.
name: Deploy to Fly.io

# Manual only: nothing deploys on a push. Run it from the Actions tab when a deploy is decided.
on:
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of cancelling a deploy that is already running.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - run: npx tsx deploy/predeploy-check.ts

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
